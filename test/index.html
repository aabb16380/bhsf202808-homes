<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调试入口 · 八班纪事</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f2e8">
<script>
  // 每次访问都换一个时间戳，强制绕过浏览器与 Pages CDN 的缓存
  var to = new URLSearchParams(location.search).get('to') || '/';
  location.replace(to + (to.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now());
</script>
</head>
<body style="font-family:system-ui;padding:40px;color:#4b463c">
  <p>正在跳转到最新版本…如果没反应，点<a id="fallback" href="/">这里</a>。</p>
  <script>
    document.getElementById('fallback').href = '/?t=' + Date.now();
  </script>
</body>
</html>
