<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调试入口 · 八班纪事</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f2e8">
<style>
  html { background: #f7f2e8; color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.85; color: #4b463c; background: #f7f2e8; text-align: center;
  }
  .card { max-width: 27rem; padding: 28px 26px; background: #fffdf7; border: 1px solid #e2d9c7; border-radius: 10px; }
  h1 { margin: 0 0 10px; font-size: 1.15rem; color: #191713; }
  p { margin: 6px 0; }
  a { color: #a33228; }
  .btn {
    display: inline-block; margin-top: 18px; padding: 9px 18px;
    border: 1px solid #191713; border-radius: 4px; background: #191713;
    color: #f7f2e8; text-decoration: none;
  }
</style>
<script>
(function () {
  // 调试入口只给管理员：这个标签页里必须已经是提权状态（2 小时内，且真输过密钥）
  var ok = false;
  try {
    var raw = sessionStorage.getItem('b8.elev');
    if (raw) {
      var o = JSON.parse(raw);
      ok = !!(o && o.token && (o.kind === 'admin' || o.kind === 'super') &&
              (!o.exp || Number(o.exp) > Date.now()));
    }
  } catch (e) {}
  if (!ok) { window.__DENY__ = true; return; }

  var to = new URLSearchParams(location.search).get('to') || '../';
  location.replace(to + (to.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now());
})();
</script>
</head>
<body>
  <div class="card" id="card">
    <h1>正在跳转到最新版本…</h1>
    <p>如果没反应，<a id="fallback" href="../">点这里</a>。</p>
  </div>
  <script>
    if (window.__DENY__) {
      document.getElementById('card').innerHTML =
        '<h1>这个入口只给管理员</h1>' +
        '<p>先用学号登录，再在右上角输入管理员密钥，然后从 ⋯ 菜单里的「调试入口」进来。</p>' +
        '<a class="btn" href="../">回首页</a>';
    } else {
      document.getElementById('fallback').href = '../?t=' + Date.now();
    }
  </script>
</body>
</html>
